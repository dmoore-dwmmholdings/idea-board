<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea Board</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="glow"></div>
    <svg class="rays" viewBox="0 0 1440 900" preserveAspectRatio="xMaxYMin slice">
      <defs>
        <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F4A259" stop-opacity="0.55"/>
          <stop offset="1" stop-color="#F4A259" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g stroke="url(#ray)" stroke-width="1" fill="none">
        <path d="M1180 -20 L640 900"/>
        <path d="M1180 -20 L780 900"/>
        <path d="M1180 -20 L900 900"/>
        <path d="M1180 -20 L1010 900"/>
        <path d="M1180 -20 L1110 900"/>
        <path d="M1180 -20 L1210 900"/>
        <path d="M1180 -20 L1320 900"/>
        <path d="M1180 -20 L1450 900"/>
      </g>
    </svg>
    <svg class="grain"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>
  </div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
      <span>Idea Board</span>
    </div>
    <nav class="view-switch" aria-label="View">
      <button type="button" data-view="board" aria-pressed="true">Board</button>
      <button type="button" data-view="archive" aria-pressed="false">Archive <span class="count" id="archive-count">0</span></button>
    </nav>
    <div class="topbar-actions">
      <label class="search">
        <span class="visually-hidden">Search ideas</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button type="button" class="btn btn-primary" id="new-idea" aria-label="New idea">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">New idea</span> <kbd class="kbd-on-accent" id="new-shortcut">⌘K</kbd>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow" id="hero-eyebrow">Your ideas</p>
      <h1 id="hero-title">What should I<br><em>build next?</em></h1>
      <p class="hero-meta" id="hero-meta"></p>
    </section>

    <div class="filters" id="filters" aria-label="Filter by tag"></div>

    <section class="board" id="board" aria-label="Idea board"></section>
    <section class="archive" id="archive" aria-label="Archived ideas" hidden></section>
  </main>

  <!-- Capture -->
  <dialog class="capture" id="capture" aria-labelledby="capture-title">
    <form id="capture-form" method="dialog" novalidate>
      <div class="capture-head">
        <p class="eyebrow">New idea</p>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <label class="visually-hidden" for="capture-title">Title</label>
      <input id="capture-title" name="title" class="capture-title" maxlength="120" placeholder="Name the idea in a few words" autocomplete="off" required>
      <label class="visually-hidden" for="capture-notes">Notes</label>
      <textarea id="capture-notes" name="notes" class="capture-notes" maxlength="5000" rows="4" placeholder="Why it matters, who it's for, first thoughts… (optional)"></textarea>
      <div class="capture-row">
        <fieldset class="stage-picker" id="capture-stage">
          <legend class="field-label">Stage</legend>
        </fieldset>
        <div class="tag-field">
          <label class="field-label" for="capture-tags">Tags</label>
          <input id="capture-tags" name="tags" placeholder="saas, dev-tools" autocomplete="off" list="tag-options">
        </div>
      </div>
      <div class="capture-foot">
        <p class="hints"><span><kbd>↵</kbd> save</span><span><kbd id="save-shortcut">⌘↵</kbd> save from notes</span><span><kbd>Esc</kbd> close</span></p>
        <button type="submit" class="btn btn-primary" id="capture-submit">Add idea</button>
      </div>
      <p class="form-error" id="capture-error" role="alert"></p>
    </form>
  </dialog>

  <!-- Detail panel -->
  <dialog class="panel" id="panel" aria-labelledby="panel-title">
    <div class="panel-inner">
      <div class="panel-head">
        <p class="eyebrow" id="panel-eyebrow"></p>
        <div class="panel-actions">
          <button type="button" class="icon-btn" id="panel-star" aria-label="Star" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1-4.5-4.2 6.1-.8z"/></svg>
          </button>
          <button type="button" class="icon-btn" data-close aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>

      <label class="visually-hidden" for="panel-title">Title</label>
      <textarea id="panel-title" class="panel-title" rows="1" maxlength="120"></textarea>

      <fieldset class="stage-picker stage-picker-wide" id="panel-stage">
        <legend class="field-label">Stage</legend>
      </fieldset>

      <div class="panel-field">
        <label class="field-label" for="panel-tags">Tags</label>
        <input id="panel-tags" placeholder="Add tags, comma-separated" autocomplete="off" list="tag-options">
      </div>

      <div class="panel-field panel-field-grow">
        <label class="field-label" for="panel-notes">Notes</label>
        <textarea id="panel-notes" maxlength="5000" placeholder="Why it matters, who it's for, open questions…"></textarea>
      </div>

      <div class="panel-foot">
        <p class="panel-dates" id="panel-dates"></p>
        <div class="panel-foot-actions">
          <button type="button" class="btn btn-ghost" id="panel-archive">Archive</button>
          <button type="button" class="btn btn-danger" id="panel-delete">Delete</button>
        </div>
      </div>
    </div>
  </dialog>

  <datalist id="tag-options"></datalist>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
